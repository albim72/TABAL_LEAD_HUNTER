<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table Hunter 1.1 — pracownia sprzedaży stołów</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f2a26;--muted:#6b726c;--line:#e2ddd2;--accent:#1f5c4a;--accent2:#c4652b;--hot:#b8321f;--warm:#c98a1c;--cold:#5a7a8c;--ok:#2f7a4b;--radius:12px;font-size:15px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:#16201c;color:#f4f1ea;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
header.top .brand{font-weight:700;letter-spacing:.3px;margin-right:6px}
header.top .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:transparent;color:#e9e4d8;border:0;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:14px}
nav.tabs button.on{background:#f4f1ea;color:#16201c;font-weight:600}
nav.tabs button .badge{background:var(--hot);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:26px;margin:4px 0 6px;font-family:Georgia,"Times New Roman",serif;font-weight:600}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;max-width:760px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g4,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-size:28px;font-weight:700;font-family:Georgia,serif}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.alert{border-color:var(--hot);background:#fff4f1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:#b9b2a3}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.warn{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{color:var(--hot);border-color:#e6b8ae}
button.small,.btn.small{padding:5px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #d4cec2;border-radius:8px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label>input,label>select,label>textarea{margin-top:3px;color:var(--ink)}
label.check{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px}
label.check input{width:auto;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#faf6ee}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.hot{background:#fbe1dc;color:var(--hot)}.warm{background:#fbefd6;color:#8a5d08}.cold{background:#e3ecf1;color:#3e5b6b}
.st{background:#ece8df;color:#4a4a42}.st.won{background:#dcefe2;color:var(--ok)}.st.lost{background:#eee;color:#888}
.muted{color:var(--muted)}.tiny{font-size:12px}
.notice{border-radius:10px;padding:10px 12px;background:#eef4f1;border:1px solid #cfe1d8;margin:10px 0;font-size:14px}
.notice.warn{background:#fff6e8;border-color:#f0d6a8}
.notice.bad{background:#fff1ee;border-color:#efc2b8}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .what{flex:1}
.score{font-size:34px;font-weight:700;font-family:Georgia,serif}
.bar{height:8px;background:#e9e4d8;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.parts td{padding:4px 6px;font-size:13px}
pre.mail{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font:13.5px/1.5 system-ui,sans-serif;margin:0}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,18,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:30px 12px;overflow:auto}
.modal{background:var(--bg);border-radius:14px;max-width:920px;width:100%;padding:18px 18px 22px;position:relative}
.modal .x{position:absolute;right:12px;top:10px}
@media(max-width:600px){.modal-bg{padding:0}.modal{border-radius:0;min-height:100vh}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16201c;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--hot)}
.steps{counter-reset:s;padding-left:0;list-style:none;margin:6px 0}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:#e6e0d3;text-align:center;font-weight:700;font-size:13px;line-height:24px}
.steps li.done::before{content:"✓";background:var(--ok);color:#fff}
.chan{border-left:4px solid var(--accent)}
.chan.p2{border-left-color:var(--warm)}.chan.p3{border-left-color:#aab2ad}
.chan h3{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.price{font-size:30px;font-weight:700;font-family:Georgia,serif;color:var(--accent)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.opts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.legal{font-size:13px}
details summary{cursor:pointer;font-weight:600}
.hide{display:none!important}

.radar-log{background:#16201c;color:#d9e8df;border-radius:10px;padding:10px 12px;margin-top:10px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;position:relative}
.radar-log .bad{color:#ffb4a6}.radar-log .muted{color:#7e968a}
.pulse{position:absolute;right:12px;top:8px;color:#7ee2a8;animation:pl 1s infinite}@keyframes pl{50%{opacity:.2}}
tr.appear{animation:ap .35s ease both}@keyframes ap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.auto-card{border:2px solid var(--accent);background:linear-gradient(180deg,#f2f8f5,#fffdf8)}
@media(prefers-reduced-motion:reduce){tr.appear,.pulse{animation:none}}
@media(max-width:700px){header.top{position:static}nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}nav.tabs button{white-space:nowrap}}
@media print{header.top,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">TABLE HUNTER 1.1<small id="brand-sub">wersja przenośna</small></div>
 <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<div id="modal-root"></div>
<script>
'use strict';
/* =========================================================================================
   TABLE HUNTER 1.0 — wersja przenośna (jeden plik). Dane zapisują się w tej przeglądarce
   (localStorage). Kopia: Ustawienia → Pobierz kopię JSON. Bez serwera, bez logowania.
   Aplikacja NIE wysyła wiadomości sama i NIE zbiera kontaktów z internetu — obsługuje klientów,
   którzy sami zostawili zapytanie (art. 398 Prawa komunikacji elektronicznej: oferta e-mailem /
   telefonem do osoby prywatnej wymaga jej uprzedniej zgody).
   ========================================================================================= */
const VERSION='1.1.0',KEY='tableHunter.v1';
const DAY=86400000;
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowIso=()=>new Date().toISOString();
const dayIso=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const addDays=(n,from=new Date())=>dayIso(new Date(new Date(from).getTime()+n*DAY));
const zl=n=>(Math.round(Number(n)||0)).toLocaleString('pl-PL')+' zł';
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso.length===10?iso+'T12:00:00':iso);return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})+(iso.length>10?' '+d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}):'');};
const hoursSince=iso=>(Date.now()-new Date(iso).getTime())/3600000;

// ---------- słowniki ----------
const SOURCES={
 google:{n:'Google (wyszukiwarka, Mapy)',pts:10},
 meta:{n:'Instagram / Facebook (formularz)',pts:6},
 www:{n:'Strona / konfigurator',pts:10},
 architect:{n:'Polecenie architekta',pts:15},
 referral:{n:'Polecenie klienta',pts:15},
 showroom:{n:'Ekspozycja u partnera / showroom',pts:12},
 fair:{n:'Targi / dzień otwarty',pts:10},
 portal:{n:'Homebook / Houzz / Oferteo',pts:8},
 marketplace:{n:'Allegro / OLX (gotowe stoły)',pts:4},
 inbound:{n:'Telefon / e-mail od klienta',pts:10},
 export:{n:'Eksport (Etsy, DE/AT)',pts:6},
 linkedin:{n:'LinkedIn (formularz)',pts:8}
};
const STATUSES=[['new','Nowe'],['contact','Rozmowa'],['quote','Wycena wysłana'],['samples','Próbki / wizyta'],['deposit','Zaliczka'],['won','Sprzedane'],['lost','Utracone']];
const STATUS=Object.fromEntries(STATUSES);
const OPEN=['new','contact','quote','samples','deposit'];
const TIMELINES={m1:['do 1 miesiąca',20],m3:['1–3 miesiące',15],m6:['3–6 miesięcy',8],later:['6+ mies. / nie wie',3]};
const INTERIORS={house:['Nowy dom',15],apartment:['Apartament premium',15],dining:['Zmiana jadalni',10],office:['Biuro / sala konferencyjna',12]};
const LOST=['Za drogo','Kupił gdzie indziej','Odłożył zakup','Brak kontaktu','Nie nasz produkt','Inny powód'];
const PSTAGES=[['found','Zidentyfikowana'],['first','Pierwszy kontakt'],['meeting','Spotkanie'],['samples','Próbki w pracowni'],['active','Aktywny partner']];
const PSTAGE=Object.fromEntries(PSTAGES);
const PNEXT={found:'Pierwszy kontakt: wiadomość na LinkedIn albo telefon do biura pracowni — przedstaw program partnerski (bez ofert e-mailem przed zgodą).',first:'Umów 30 min spotkania w pracowni z zestawem próbek i katalogiem realizacji.',meeting:'Zostaw zestaw próbek i pliki 3D; ustal prowizję i sposób polecania klientów.',samples:'Po 2 tygodniach zapytaj o projekt, w którym stół może się pojawić — zaproponuj wizualizację w 48 h.',active:'Raz w miesiącu: nowe realizacje, rozliczenie prowizji, pytanie o kolejne projekty.'};

function defaults(){return {
 brand:'Premium Resin',seller:'Michał Zieliński',phone:'661 088 383',email:'biuro@premiumresin.pl',respondHours:1,commission:10,delivery:600,months:3,
 woods:{dab:{n:'Dąb',m2:5200},orzech:{n:'Orzech amerykański',m2:7500},wiaz:{n:'Wiąz',m2:6000},akacja:{n:'Akacja / suar',m2:4800}},
 styles:{river:{n:'Rzeka',k:1},ocean:{n:'Ocean (żywica na krawędzi)',k:1.15},solid:{n:'Lity z wtrąceniami',k:1.35}},
 legs:{u:{n:'U-profil',p:1400},x:{n:'X-rama',p:1900},spider:{n:'Pająk',p:2600}},
 finishes:{oil:{n:'Olej-wosk',k:0},lacquer:{n:'Lakier 2K (mat)',k:.08}},
 colors:['Transparentna','Granat','Szmaragd','Grafit','Biel perłowa','Bursztyn']
};}
function emptyState(){return {v:1,settings:defaults(),leads:[],tasks:[],partners:[],costs:{},playbook:{},demo:false};}

// ---------- zapis ----------
let storageOK=true;
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return emptyState();const s=JSON.parse(raw);return normalize(s);}catch(e){storageOK=false;return emptyState();}}
function normalize(s){const d=emptyState();s={...d,...s};s.settings={...defaults(),...(s.settings||{})};for(const k of ['leads','tasks','partners'])if(!Array.isArray(s[k]))s[k]=[];s.costs=s.costs&&typeof s.costs==='object'?s.costs:{};s.playbook=s.playbook&&typeof s.playbook==='object'?s.playbook:{};return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
let state=load();

// ---------- wycena ----------
function quote(c,S=state.settings){
 const w=S.woods[c.wood]||Object.values(S.woods)[0],st=S.styles[c.style]||Object.values(S.styles)[0],lg=S.legs[c.legs]||Object.values(S.legs)[0],f=S.finishes[c.finish]||{k:0};
 const L=Math.min(400,Math.max(60,Number(c.len)||200)),W=Math.min(140,Math.max(40,Number(c.wid)||90)),area=L*W/10000;
 const base=(area*w.m2*st.k+lg.p)*(1+f.k)+Number(S.delivery||0);
 const r=x=>Math.round(x/100)*100;
 return {lo:r(base*.92),hi:r(base*1.08),mid:r(base),area,label:`${w.n}, ${st.n.toLowerCase()}${c.color?', żywica '+c.color.toLowerCase():''}, ${L}×${W} cm, nogi aluminiowe ${lg.n}`};
}
const defConfig=()=>({wood:'orzech',style:'river',color:'Granat',legs:'u',finish:'oil',len:220,wid:95});

// ---------- scoring ----------
function score(l){
 const parts=[];let pts=0;const add=(label,p,why)=>{parts.push([label,p,why]);pts+=p;};
 const q=l.config?quote(l.config):null,b=Number(l.budget)||0;
 if(!b)add('Budżet',8,'nie podano — zapytaj w rozmowie');
 else if(!q)add('Budżet',b>=15000?25:b>=9000?15:5,zl(b)+' (bez konfiguracji stołu)');
 else{const r=b/q.mid;add('Budżet',r>=1?30:r>=.8?20:r>=.6?10:0,`${zl(b)} wobec ok. ${zl(q.mid)} za wybrany stół`+(r<.8?' — zaproponuj mniejszy blat lub dąb':''));}
 const t=TIMELINES[l.timeline];add('Termin',t?t[1]:5,t?t[0]:'nie podano');
 const i=INTERIORS[l.interior];add('Wnętrze',i?i[1]:6,i?i[0]:'nie podano');
 if(l.architect)add('Architekt',10,'pracuje z architektem — decyzja szybsza, warto go włączyć');
 const s=SOURCES[l.source];add('Źródło',s?s.pts:5,s?s.n:'inne');
 if(l.phone||l.email)add('Kontakt',5,[l.phone&&'telefon',l.email&&'e-mail'].filter(Boolean).join(' + '));
 pts=Math.min(100,pts);
 const level=pts>=75?'hot':pts>=50?'warm':'cold';
 return {pts,parts,level,label:{hot:'Gorące',warm:'Ciepłe',cold:'Chłodne'}[level],sla:{hot:'odpowiedz w ciągu '+state.settings.respondHours+' h',warm:'odpowiedz dziś',cold:'odpowiedz w 48 h, potem przypomnienie'}[level],q};
}
const lvlPill=sc=>`<span class="pill ${sc.level}">${sc.label} · ${sc.pts}</span>`;
const stPill=s=>`<span class="pill st ${s==='won'?'won':s==='lost'?'lost':''}">${h(STATUS[s]||s)}</span>`;

// ---------- następny krok ----------
function nextStep(l){
 if(l.status==='new')return 'Odpowiedz klientowi ('+score(l).sla+'): wycena widełkowa + propozycja rozmowy lub wideo z pracowni.';
 return {contact:'Wyślij wycenę i zdjęcia desek do wyboru; ustal termin decyzji.',quote:'Po 3 dniach przypomnij się: zaproponuj próbki żywicy w wybranym kolorze lub wizualizację we wnętrzu.',samples:'Umów odbiór próbek / wizytę w pracowni; zaproponuj termin zaliczki i rezerwację deski.',deposit:'Potwierdź projekt i termin produkcji; wyślij zdjęcia wybranej deski.',won:'Po montażu poproś o zdjęcia i polecenie (program poleceń — rabat dla znajomych).',lost:'Zapisz powód. Jeśli jest zgoda na e-mail — dodaj do inspiracji raz w miesiącu.'}[l.status]||'';
}
function openTasks(l){return state.tasks.filter(t=>t.leadId===l.id&&!t.done);}

// ---------- treść odpowiedzi ----------
function reply(l,kind){
 const S=state.settings,q=l.config?quote(l.config):null;
 const src={meta:'z Instagrama',google:'',www:'ze strony',architect:'— polecenie od Pani/Pana architekta',referral:'z polecenia',showroom:'po obejrzeniu stołu na ekspozycji',fair:'po rozmowie na targach',portal:'',marketplace:'',inbound:'',export:''}[l.source]||'';
 const tl={m1:'Przy terminie do miesiąca warto zarezerwować deskę już teraz.',m3:'W terminie 1–3 miesięcy spokojnie zdążymy z realizacją.',m6:'Mamy czas, żeby wybrać idealną deskę i dopracować projekt.',later:'Chętnie przygotuję projekt z wyprzedzeniem — bez zobowiązań.'}[l.timeline]||'';
 const sign=`\n\nZ poważaniem\n${S.seller}\n${S.brand} · ${S.phone} · ${S.email}`;
 const cfg=q?`Stół, o który Pan/Pani pyta (${q.label}), to orientacyjnie ${zl(q.lo)}–${zl(q.hi)} brutto, z dostawą i montażem.`:'Cena zależy od gatunku drewna, wymiarów i stylu żywicy — dla stołu 220×95 cm z orzecha to orientacyjnie '+zl(quote(defConfig()).lo)+'–'+zl(quote(defConfig()).hi)+'.';
 const subj=`Stół z żywicy${q?' — '+q.label.split(',')[0]+' '+(l.config.len||'')+'×'+(l.config.wid||''):''} · ${S.brand}`;
 if(kind==='followup'||l.status==='quote')return {subject:'Re: '+subj,body:`Dzień dobry,\n\nwracam w sprawie wyceny stołu.${q?' ('+q.label+')':''} Czy mogę pomóc w decyzji? Mogę:\n• wysłać próbki żywicy w wybranym kolorze i fragment drewna,\n• przygotować wizualizację stołu w Pani/Pana wnętrzu (wystarczy zdjęcie jadalni),\n• pokazać deski, z których wybierzemy blat — na wideo albo w pracowni.\n\nKtóra opcja będzie najwygodniejsza?`+sign};
 if(kind==='after')return {subject:'Dziękujemy za zaufanie · '+S.brand,body:`Dzień dobry,\n\ndziękujemy za wybór naszego stołu. Jeśli wszystko się podoba, będziemy wdzięczni za 2–3 zdjęcia stołu we wnętrzu — i za polecenie nas znajomym: osoba z Pani/Pana polecenia otrzyma rabat, a Pan/Pani — prezent przy kolejnym zamówieniu.`+sign};
 return {subject:subj,body:`Dzień dobry,\n\ndziękuję za zapytanie${src?' '+src:''}. ${cfg}${l.budget&&q&&Number(l.budget)<q.lo?' Jeśli budżet ma zostać przy '+zl(l.budget)+', zaproponuję mniejszy blat albo dąb zamiast orzecha — efekt rzeki zostaje.':''}\n\nKażdy blat powstaje z jednego kawałka drewna, który wybieramy razem — przed produkcją wysyłamy zdjęcia desek do akceptacji i wizualizację stołu we wnętrzu. Nogi wykonujemy z aluminium we własnej produkcji. ${tl}\n\nProponuję krótką rozmowę (15 minut) albo wideo z pracowni — pasuje jutro o 10:00 lub o 17:00?${l.architect?'\n\nChętnie przekażemy też próbki i pliki 3D Pani/Pana architektowi.':''}`+sign};
}

const PLAYBOOK=[

function decodeFile(buf){const b=new Uint8Array(buf);if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);return new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'');}
function parseCSV(t){const first=t.split(/\r?\n/)[0]||'';const d=['\t',';',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}else if(c==='"')q=true;else if(c===d){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}
 row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function pickCol(hdr,res){const i=hdr.findIndex(x=>res.some(r=>r.test(x)));return i;}
function importCSV(text,target,source){
 const rows=parseCSV(text);if(rows.length<2)return toast('Plik nie zawiera wierszy z danymi.',true);
 const hdr=rows[0].map(x=>x.trim().toLowerCase());const col=res=>pickCol(hdr,res);
 const iFull=col([/^full.?name$/,/imi[eę] i nazwisko/,/^name$/,/^nazwa$/]),iFirst=col([/first.?name/,/^imi[eę]$/]),iLast=col([/last.?name/,/^nazwisko$/]),iMail=col([/e-?mail/]),iPhone=col([/phone/,/telefon/]),iCity=col([/city/,/miasto/,/miejscowo/]),iComp=col([/company/,/firma/,/organi/]),iTitle=col([/job.?title/,/stanowisko/,/title/]),iBudget=col([/bud[zż]et/,/budget/]),iCons=col([/zgod/,/consent/,/marketing/]),iWeb=col([/website/,/strona/,/www/]);
 const g=(r,i)=>i>=0?String(r[i]||'').trim():'';let added=0,skip=0;
 for(const r of rows.slice(1)){const name=g(r,iFull)||[g(r,iFirst),g(r,iLast)].filter(Boolean).join(' ');const email=g(r,iMail),phone=g(r,iPhone);
  if(target==='partners'){const comp=g(r,iComp)||name;if(!comp){skip++;continue;}if(addPartnerFrom({name:comp,city:g(r,iCity),person:iComp>=0?name:'',email,phone,website:g(r,iWeb),type:'architect',notes:[g(r,iTitle),'Import CSV ('+(source==='linkedin'?'LinkedIn Lead Gen':'CSV')+')'].filter(Boolean).join(' · ')},source))added++;else skip++;continue;}
  if(!name&&!email&&!phone){skip++;continue;}if(email&&state.leads.some(l=>l.email&&l.email.toLowerCase()===email.toLowerCase())){skip++;continue;}
  const cons=/^(tak|yes|true|1|zgadzam)/i.test(g(r,iCons));
  const l={id:uid(),created:nowIso(),status:'new',name:name||email,city:g(r,iCity),email,phone,source,partnerId:'',budget:Number(g(r,iBudget).replace(/[^\d]/g,''))||0,timeline:'m3',interior:'house',architect:false,consents:{email:cons,phone:false},notes:'Import CSV'+(g(r,iComp)?' · firma: '+g(r,iComp):'')+(g(r,iTitle)?' · '+g(r,iTitle):''),config:null,history:[]};
  hist(l,'Zaimportowano z pliku CSV ('+(SOURCES[source]?.n||source)+').');state.leads.push(l);added++;}
 save();render();toast(`Import CSV: dodano ${added}${target==='partners'?' firm':' zapytań'}${skip?', pominięto '+skip+' (puste lub już w bazie)':''}.`);
}

 modal(`<h2>Import CSV — formularze reklamowe</h2><p class="tiny muted">Meta (Instagram/Facebook): Menedżer reklam / Meta Business Suite → Formularze błyskawiczne → Pobierz (CSV). LinkedIn: Campaign Manager → Assets → Lead generation forms → Download leads (CSV). Kolumny rozpoznają się same (imię, e-mail, telefon, miasto, firma, stanowisko, zgody).</p>
 <form id="csv-form"><div class="grid g2"><label>Dokąd<select name="target"><option value="leads">Zapytania klientów (B2C)</option><option value="partners">Architekci i partnerzy (firmy)</option></select></label>
 <label>Źródło<select name="source"><option value="meta">Instagram / Facebook (formularz)</option><option value="linkedin">LinkedIn Lead Gen Form</option>${Object.entries(SOURCES).filter(([k])=>k!=='meta').map(([k,v])=>`<option value="${k}">${h(v.n)}</option>`).join('')}</select></label></div>
 <label>Plik CSV<input type="file" name="file" accept=".csv,text/csv,.txt" required></label><p class="tiny muted">Zgoda marketingowa jest zaznaczana tylko wtedy, gdy plik ma kolumnę zgody z odpowiedzią „tak”.</p><button class="primary" type="submit">Importuj</button></form>`);
 $('#csv-form').onsubmit=async e=>{e.preventDefault();const f=e.target,file=f.file.files[0];if(!file)return;const text=decodeFile(await file.arrayBuffer());let src=f.source.value;if(src==='linkedin'&&f.target.value==='leads')src='inbound';importCSV(text,f.target.value,f.target.value==='partners'?(f.source.value==='linkedin'?'linkedin':'csv'):src);closeModal();};
}

// ---------- Ustawienia ----------
function settingsPage(){
 const S=state.settings;
 $('#view').innerHTML=`<h1>Ustawienia</h1>${storageNote()}<div class="grid g2"><div class="card"><h2>Firma i podpis</h2><form id="s-form"><label>Marka<input name="brand" value="${h(S.brand)}"></label><label>Handlowiec (podpis)<input name="seller" value="${h(S.seller)}"></label><div class="grid g2"><label>Telefon<input name="phone" value="${h(S.phone)}"></label><label>E-mail<input name="email" value="${h(S.email)}"></label><label>Czas odpowiedzi na gorące (h)<input name="respondHours" type="number" min="1" max="48" value="${S.respondHours}"></label><label>Prowizja architekta (%)<input name="commission" type="number" min="0" max="40" value="${S.commission}"></label></div>
 <h3>Cennik (do potwierdzenia przez firmę)</h3><div class="grid g2">${Object.entries(S.woods).map(([k,v])=>`<label>${h(v.n)} — zł/m² blatu<input name="w_${k}" type="number" min="0" step="100" value="${v.m2}"></label>`).join('')}${Object.entries(S.legs).map(([k,v])=>`<label>Nogi ${h(v.n)} — zł<input name="l_${k}" type="number" min="0" step="50" value="${v.p}"></label>`).join('')}${Object.entries(S.styles).map(([k,v])=>`<label>${h(v.n)} — mnożnik<input name="s_${k}" type="number" min="0.5" max="3" step="0.05" value="${v.k}"></label>`).join('')}<label>Dostawa i montaż — zł<input name="delivery" type="number" min="0" step="50" value="${S.delivery}"></label></div>
 <h3>Radar firm — klucz Google Maps</h3><label>Klucz API Google Maps (Places)<input name="googleKey" value="${h(S.googleKey||'')}" placeholder="AIza…" autocomplete="off"></label>
 <details class="tiny"><summary>Jak zdobyć klucz (ok. 5 minut)</summary><ol><li>console.cloud.google.com → nowy projekt (np. „Table Hunter”) → podepnij konto rozliczeniowe (Google daje miesięczny limit darmowych zapytań, sprawdź aktualny cennik).</li><li>Interfejsy API: włącz <b>Maps JavaScript API</b> i <b>Places API (New)</b>.</li><li>Dane logowania → Utwórz dane logowania → Klucz API. Ogranicz klucz do tych dwóch API.</li><li>Wklej klucz tutaj i zapisz. W „Szukaj klienta” radar szuka już naprawdę.</li></ol>Klucz zostaje tylko w tej przeglądarce i w kopiach JSON — nie udostępniaj kopii osobom spoza firmy.</details>
 <button class="primary" type="submit">Zapisz ustawienia</button></form></div>
 <div class="card"><h2>Dane i kopie</h2><p class="tiny muted">Dane są tylko w tej przeglądarce na tym komputerze. Kopia JSON przenosi je na inny komputer lub telefon.</p>
 <div class="row"><button data-act="backup">Pobierz kopię JSON</button><button data-act="restore">Wczytaj kopię JSON</button><input type="file" id="restore-file" accept=".json,application/json" class="hide"></div>
 <div class="row" style="margin-top:8px"><button data-act="csv-import">Import CSV (Meta / LinkedIn)</button><button data-act="csv">Eksport zapytań CSV (Excel)</button><button data-act="newsletter">Lista do newslettera (tylko zgody)</button></div>
 <h3>Pokaz</h3><div class="row"><button data-act="demo">Wczytaj dane demo</button><button class="danger" data-act="wipe">Wyczyść wszystkie dane</button></div>
 <p class="tiny muted" style="margin-top:14px">Table Hunter ${VERSION} · jeden plik HTML, działa bez internetu. Zapytania: ${state.leads.length} · pracownie: ${state.partners.length} · zadania: ${state.tasks.length}.</p></div></div>`;
 $('#s-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const k of ['brand','seller','phone','email','googleKey'])S[k]=(f[k]||'').trim();mapsReady=null;S.respondHours=Math.max(1,Number(f.respondHours)||1);S.commission=Math.max(0,Number(f.commission)||0);S.delivery=Math.max(0,Number(f.delivery)||0);for(const k in S.woods)S.woods[k].m2=Number(f['w_'+k])||S.woods[k].m2;for(const k in S.legs)S.legs[k].p=Number(f['l_'+k])||S.legs[k].p;for(const k in S.styles)S.styles[k].k=Number(f['s_'+k])||S.styles[k].k;save();render();toast('Zapisano ustawienia.');};
 $('#restore-file').onchange=e=>{const file=e.target.files[0];if(!file)return;file.text().then(t=>{try{const x=JSON.parse(t);if(!x||x.kind!=='table-hunter-backup'||!x.state)throw Error();if(!confirm('Zastąpić bieżące dane kopią z '+fmtDate(x.at)+'?'))return;state=normalize(x.state);save();render();toast('Wczytano kopię.');}catch{toast('To nie jest kopia Table Hunter.',true);}});};
}

// ---------- pliki ----------
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
function csv(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');}

function copyText(text,msg='Skopiowano. Wklej tam, gdzie potrzebujesz.'){const fb=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg);}catch{toast('Zaznacz tekst i skopiuj ręcznie.',true);}ta.remove();};try{navigator.clipboard.writeText(text).then(()=>toast(msg),fb);}catch{fb();}}
// ---------- modal ----------
let modalLead=null;
function modal(html,leadId=null){modalLead=leadId;$('#modal-root').innerHTML=`<div class="modal-bg" data-bg="1"><div class="modal"><button class="x small" data-act="close">✕</button>${html}</div></div>`;}
function closeModal(){modalLead=null;$('#modal-root').innerHTML='';}

// ---------- zdarzenia ----------
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go],[data-act],[data-lead],[data-done],[data-status],[data-cfg],[data-referral],[data-pedit],[data-copy],.modal-bg');if(!b)return;
 if(b.classList.contains('modal-bg')){if(e.target===b)closeModal();return;}
 const d=b.dataset;
 if(d.go){e.preventDefault();closeModal();return go(d.go);}
 if(d.lead){return openLead(d.lead);}
 if(d.done){const t=state.tasks.find(x=>x.id===d.done);if(t){t.done=true;t.doneAt=nowIso();const l=state.leads.find(x=>x.id===t.leadId);if(l)hist(l,'Zrobione: '+t.title+'.');save();if(modalLead)openLead(modalLead);render();toast('Zadanie zrobione. Pamiętaj o kolejnym kroku.');}return;}
 if(d.status)return setStatus(d.id,d.status);
 if(d.cfg){cfg[d.cfg]=d.val;return quotePage();}
 if(d.referral){return leadForm({source:'architect',partnerId:d.referral,architect:true});}
 if(d.pedit){return partnerForm(state.partners.find(p=>p.id===d.pedit));}
 if(d.copy!==undefined){copyText(d.copy);state.huntCopied=(state.huntCopied||0)+1;save();return;}
 const A=d.act;
 if(A==='close')return closeModal();
 if(A==='radar-run')return runRadar();
 if(A==='radar-all'){radar.results.forEach(r=>{if(!partnerExists(r))r.pick=true;});return drawRadar();}
 if(A==='radar-add'){let n=0;for(const r of radar.results)if(r.pick&&addPartnerFrom(r,'radar'))n++;save();drawRadar();tabs();return toast(n?`Dodano ${n} firm do Architektów i partnerów (etap „Zidentyfikowana”).`:'Zaznacz firmy do dodania.',!n);}
 if(A==='agent-toggle'){agentOpen=!agentOpen;return huntPage();}
 if(A==='agent-copy'){state.agentCopied=true;save();return copyText(agentTask(),'Zadanie skopiowane — wklej je agentowi AI.');}
 if(A==='agent-import')return importAgent($('#agent-json').value);
 if(A==='csv-import')return csvImportForm();
 if(A==='hunt-set')return window._huntSet&&window._huntSet();
 if(A==='won-list'){leadFilter={status:'won',source:'',q:''};return go('leads');}
 if(A==='new-lead')return leadForm();
 if(A==='edit-lead')return leadForm(state.leads.find(x=>x.id===d.id));
 if(A==='new-partner')return partnerForm({stage:'found'});
 if(A==='quote-lead')return leadForm({source:'www',config:{...cfg}});
 if(A==='copy-reply'||A==='mailto'){const l=state.leads.find(x=>x.id===d.id);const m=reply(l,d.kind==='followup'?'followup':d.kind==='after'?'after':'first');
  if(d.kind==='followup')l.followupCopied=true;else if(d.kind!=='after')l.replied=true;if(!l.repliedAt&&d.kind!=='after')l.repliedAt=nowIso();hist(l,(A==='mailto'?'Otwarto w poczcie: ':'Skopiowano: ')+(d.kind==='followup'?'przypomnienie':d.kind==='after'?'prośba o polecenie':'odpowiedź')+'.');save();
  if(A==='copy-reply'){copyText('Temat: '+m.subject+'\n\n'+m.body,'Skopiowano. Wklej do poczty lub komunikatora.');openLead(l.id);}
  render();return;}
 if(A==='save-notes'){const l=state.leads.find(x=>x.id===d.id);l.notes=$('#lead-notes').value;hist(l,'Notatka zaktualizowana.');save();toast('Zapisano notatkę.');return openLead(l.id);}
 if(A==='demo'){if(state.leads.length&&!state.demo&&!confirm('Wczytać dane demo? Twoje obecne dane w tej przeglądarce zostaną zastąpione (pobierz najpierw kopię w Ustawieniach).'))return;state=demoState();save();page='pulpit';render();toast('Wczytano dane demo — przejdź Scenariusze.');return;}
 if(A==='wipe'){if(!confirm('Usunąć wszystkie dane z tej przeglądarki? Tej operacji nie można cofnąć.'))return;state=emptyState();save();render();toast('Dane usunięte.');return;}
 if(A==='backup'){download('TableHunter_kopia_'+dayIso()+'.json',JSON.stringify({kind:'table-hunter-backup',version:VERSION,at:nowIso(),state},null,1));return toast('Pobrano kopię.');}
 if(A==='restore')return $('#restore-file').click();
 if(A==='csv'){download('TableHunter_zapytania_'+dayIso()+'.csv',csv([['Data','Klient','Miasto','E-mail','Telefon','Źródło','Architekt','Budżet','Stół','Cena od','Cena do','Wynik','Status','Kwota sprzedaży','Zgoda e-mail','Zgoda telefon'],...state.leads.map(l=>{const s=score(l);return [l.created.slice(0,10),l.name,l.city,l.email,l.phone,SOURCES[l.source]?.n,partnerName(l.partnerId),l.budget,s.q?.label||'',s.q?.lo||'',s.q?.hi||'',s.pts,STATUS[l.status],l.wonValue||'',l.consents?.email?'tak':'nie',l.consents?.phone?'tak':'nie'];})]),'text/csv;charset=utf-8');return toast('Pobrano CSV.');}
 if(A==='newsletter'){const ok=state.leads.filter(l=>l.consents?.email&&l.email),no=state.leads.filter(l=>l.email&&!l.consents?.email).length;download('TableHunter_newsletter_zgody_'+dayIso()+'.csv',csv([['E-mail','Imię','Miasto','Data zgody (zapytanie)'],...ok.map(l=>[l.email,l.name,l.city,l.created.slice(0,10)])]),'text/csv;charset=utf-8');state.newsletterExported=true;save();render();return toast(`Lista: ${ok.length} osób ze zgodą. Pominięto ${no} bez zgody.`);}
 if(A==='print')return window.print();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.rcat){radar.cats[t.dataset.rcat]=t.checked;return;}
 if(t.dataset.rpick!==undefined){radar.results[Number(t.dataset.rpick)].pick=t.checked;return;}
 if(t.dataset.cost!==undefined){state.costs[t.dataset.cost]=Math.max(0,Number(t.value)||0);save();channelsPage();return;}
 if(t.dataset.plan){state.playbook[t.dataset.plan]=t.checked;save();channelsPage();return;}
 if(t.dataset.pstage){const p=state.partners.find(x=>x.id===t.dataset.pstage);p.stage=t.value;save();partnersPage();toast('Etap: '+PSTAGE[t.value]+'.');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();});
window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render();}});
render();
</script>
</body>
</html>
